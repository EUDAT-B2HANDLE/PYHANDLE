[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pyhandle"
version = "2.0.0-beta.0"
description = "Library for management of handles"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["handles", "PIDs", "PIDINST"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.31", "PyMySQL>=1.1"]

[project.urls]
Homepage = "https://github.com/EUDAT-B2HANDLE/PYHANDLE"
Issues = "https://github.com/EUDAT-B2HANDLE/PYHANDLE/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mock>=5", "ruff>=0.8", "ty>=0.0.1", "build>=1"]

[tool.hatch.build.targets.wheel]
packages = ["pyhandle"]

[tool.hatch.build.targets.sdist]
include = ["pyhandle", "tests", "docs", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_unit_test.py"]
python_classes = ["Test*", "*TestCase"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W605"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"
